name: Release

# Push a tag like v1.2.0 to publish a release. Installed copies find it through
# the GitHub "latest release" endpoint and update themselves, so the tag must
# match the version in package.json - otherwise every install would see an
# update that never makes its version number go up.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
